# fly.toml app configuration file generated for gamejojos on 2026-11-04T13:28:08Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'gamejojos'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 4096
  processes = ['app']
  size = 'shared-cpu-2x'

[[restart]]
  policy = 'on-failure'
  processes = ['app']
  retries = 15
